name: Jenkins Migration

on:
  workflow_dispatch:
    inputs:
      flag:
        description: Enable feature flag
        type: boolean
        default: true
      SOME_STRING:
        description: Test string parameter
        type: string
        default: hello
      ENVIRONMENT:
        description: Target environment
        type: choice
        options:
          - dev
          - staging
          - prod
        default: dev
  schedule:
    - cron: "0 0 * * *"
    - cron: "*/5 * * * *"
  push:

concurrency:
  group: jenkins-migration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  root-init:
    name: Root Jenkinsfile - Init
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # actions/checkout v4 pinned at 11d5960a326750d5838078e36cf38b85af677262.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Resolve Maven metadata
        shell: bash
        run: |
          echo "GIT_TAG_COMMIT=$(git describe --tags --always)" >> "$GITHUB_ENV"
          if [ -x ./mvnw ] && [ -f pom.xml ]; then
            VERSION=$(./mvnw org.apache.maven.plugins:maven-help-plugin:2.1.1:evaluate -Dexpression=project.version -q -DforceStdout)
            GROUP_ID=$(./mvnw org.apache.maven.plugins:maven-help-plugin:2.1.1:evaluate -Dexpression=project.groupId -q -DforceStdout)
            if [[ "$VERSION" == *-SNAPSHOT ]]; then
              IS_SNAPSHOT_VALUE=true
            else
              IS_SNAPSHOT_VALUE=false
            fi
            {
              echo "POM_VERSION=$VERSION"
              echo "POM_GROUP_ID=$GROUP_ID"
              echo "BUILD_RELEASE_VERSION=${VERSION/-SNAPSHOT/}"
              echo "IS_SNAPSHOT=$IS_SNAPSHOT_VALUE"
              echo "version_a=$VERSION"
            } >> "$GITHUB_ENV"
          else
            echo "No executable Maven wrapper and pom.xml found; skipping Maven metadata resolution."
          fi
      - name: Print environment and parameters
        shell: bash
        run: |
          echo "version_a: ${version_a:-}"
          env | sort
          echo "Workflow inputs: ${{ toJson(github.event.inputs) }}"

  parameters-triggers:
    name: Parameters, Triggers, and Options
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FLAG: ${{ github.event.inputs.flag || 'true' }}
      SOME_STRING: ${{ github.event.inputs.SOME_STRING || 'hello' }}
      ENVIRONMENT: ${{ github.event.inputs.ENVIRONMENT || 'dev' }}
    steps:
      # actions/checkout v4 pinned at 11d5960a326750d5838078e36cf38b85af677262.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup
        shell: bash
        run: |
          echo "Parameter flag: ${FLAG}"
          echo "Parameter string: ${SOME_STRING}"
          echo "Environment: ${ENVIRONMENT}"
      - name: Build
        shell: bash
        run: |
          echo "Building for ${ENVIRONMENT}"
          test -f README.md || echo "No README found"

  tools-agents-build:
    name: Tools and Agents - Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # actions/checkout v4 pinned at 11d5960a326750d5838078e36cf38b85af677262.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # actions/setup-java v4 pinned at cf277c60eb25467037889841efdb72551f06f6c3.
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "11"
          cache: maven
      - name: Build
        if: ${{ hashFiles('pom.xml') != '' }}
        shell: bash
        run: |
          echo "M2_HOME: ${M2_HOME:-}"
          echo "JAVA_HOME: ${JAVA_HOME}"
          mvn clean compile -Dmaven.test.skip=true
      - name: Skip build when Maven project is absent
        if: ${{ hashFiles('pom.xml') == '' }}
        run: echo "No pom.xml found; skipping Maven build."
      # actions/upload-artifact v4 pinned at ea165f8d65b6e75b540449e92b4886f43607fa02.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ hashFiles('target/**/*') != '' }}
        with:
          name: build-artifacts
          path: target/**/*
          retention-days: 5

  tools-agents-test:
    name: Tools and Agents - Test
    runs-on: ubuntu-latest
    needs: tools-agents-build
    timeout-minutes: 10
    steps:
      # actions/checkout v4 pinned at 11d5960a326750d5838078e36cf38b85af677262.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # actions/setup-java v4 pinned at cf277c60eb25467037889841efdb72551f06f6c3.
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "11"
          cache: maven
      - name: Test
        if: ${{ hashFiles('pom.xml') != '' }}
        run: mvn test
      - name: Skip test when Maven project is absent
        if: ${{ hashFiles('pom.xml') == '' }}
        run: echo "No pom.xml found; skipping Maven tests."
      # actions/upload-artifact v4 pinned at ea165f8d65b6e75b540449e92b4886f43607fa02.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: surefire-reports
          path: target/surefire-reports/*.xml
          if-no-files-found: ignore
          retention-days: 5
      # actions/upload-artifact v4 pinned at ea165f8d65b6e75b540449e92b4886f43607fa02.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: jacoco-coverage
          path: target/site/jacoco/jacoco.xml
          if-no-files-found: ignore
          retention-days: 5

  tools-agents-quality:
    name: Tools and Agents - Quality
    runs-on: ubuntu-latest
    needs: tools-agents-build
    timeout-minutes: 10
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      # actions/checkout v4 pinned at 11d5960a326750d5838078e36cf38b85af677262.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # actions/setup-java v4 pinned at cf277c60eb25467037889841efdb72551f06f6c3.
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "11"
          cache: maven
      - name: Sonar quality
        if: ${{ hashFiles('pom.xml') != '' && env.SONAR_TOKEN != '' }}
        run: mvn sonar:sonar -Dsonar.login="${SONAR_TOKEN}"
      - name: Skip quality when prerequisites are absent
        if: ${{ hashFiles('pom.xml') == '' || env.SONAR_TOKEN == '' }}
        run: echo "Skipping Sonar quality scan because pom.xml or SONAR_TOKEN is unavailable."
